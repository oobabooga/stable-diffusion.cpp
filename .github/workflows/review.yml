name: H3 stack review CI (throwaway, do not merge)

on:
  push:
    branches: [rev-h3-stack-ci]

permissions: {}

env:
  REPO_URL: https://github.com/oobabooga/stable-diffusion.cpp
  MASTER_SHA: 6321a6935234c2bb09c77604874a439344faa7f6
  LIB_URL: https://raw.githubusercontent.com/oobabooga/stable-diffusion.cpp/${{ github.sha }}/ci/lib.sh
  OPS_FULL: "ROPE_PE_PERMUTE MODULATE_ROWS SWIGLU_SCALED RMS_NORM CPY CONV_2D_DW GLU FLASH_ATTN_EXT MUL_MAT"
  OPS_LIGHT: "ROPE_PE_PERMUTE MODULATE_ROWS SWIGLU_SCALED RMS_NORM CPY CONV_2D_DW GLU"

jobs:
  # Every PR head on CPU, with and without the carried ggml patches. Each job builds master too
  # and compares fixed-seed SD-Turbo renders byte for byte.
  linux-cpu:
    name: linux-cpu ${{ matrix.ref }} patched=${{ matrix.patched }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ref: [pr17, pr18, pr19, pr20]
        patched: ["1", "0"]
        include:
          - {ref: pr17, sha: ca92d95ddf041bf885a36a7fdafbffd88706c28e}
          - {ref: pr18, sha: 5f222b85a9b52e7d6f43fdffcb0772806459154b}
          - {ref: pr19, sha: 338079ece82649c7535da4bbba663f29b4bc1a25}
          - {ref: pr20, sha: aff34f1542edb66acf2f5bb5daae1c895db0afe4}
    steps:
      - name: Build master and head
        run: |
          curl -fsSL "$LIB_URL" -o lib.sh; . ./lib.sh
          fetch_src "$MASTER_SHA" m 0 && build_sd m sd-cli
          fetch_src "${{ matrix.sha }}" h "${{ matrix.patched }}" && build_sd h sd-cli
      - name: Smoke master vs head
        run: |
          . ./lib.sh; get_model
          smoke m/build/bin/sd-cli out/m 512
          smoke h/build/bin/sd-cli out/h 512
          compare_dirs out/m out/h
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with: {name: "smoke-linux-cpu-${{ matrix.ref }}-p${{ matrix.patched }}", path: out, if-no-files-found: ignore}

  linux-arm64-cpu:
    name: linux-arm64-cpu ${{ matrix.ref }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ref: pr17, sha: ca92d95ddf041bf885a36a7fdafbffd88706c28e}
          - {ref: pr18, sha: 5f222b85a9b52e7d6f43fdffcb0772806459154b}
          - {ref: pr19, sha: 338079ece82649c7535da4bbba663f29b4bc1a25}
          - {ref: pr20, sha: aff34f1542edb66acf2f5bb5daae1c895db0afe4}
    steps:
      - name: Build master and head (patched)
        run: |
          curl -fsSL "$LIB_URL" -o lib.sh; . ./lib.sh
          fetch_src "$MASTER_SHA" m 0 && build_sd m sd-cli
          fetch_src "${{ matrix.sha }}" h 1 && build_sd h sd-cli
      - name: Smoke master vs head
        run: |
          . ./lib.sh; get_model
          smoke m/build/bin/sd-cli out/m 512
          smoke h/build/bin/sd-cli out/h 512
          compare_dirs out/m out/h

  # Vulkan on Mesa lavapipe (software). Checks the new ops report unsupported rather than crash,
  # and that SD-Turbo renders identically to master on the Vulkan backend.
  linux-vulkan:
    name: linux-vulkan-lavapipe ${{ matrix.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ref: pr17, sha: ca92d95ddf041bf885a36a7fdafbffd88706c28e}
          - {ref: pr18, sha: 5f222b85a9b52e7d6f43fdffcb0772806459154b}
          - {ref: pr19, sha: 338079ece82649c7535da4bbba663f29b4bc1a25}
          - {ref: pr20, sha: aff34f1542edb66acf2f5bb5daae1c895db0afe4}
    steps:
      - name: Deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libvulkan-dev glslc mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary | grep -E 'deviceName|driverName' || true
      - name: Build master and head (patched)
        run: |
          curl -fsSL "$LIB_URL" -o lib.sh; . ./lib.sh
          fetch_src "$MASTER_SHA" m 0 && build_sd m sd-cli -DSD_VULKAN=ON
          fetch_src "${{ matrix.sha }}" h 1 && build_sd h "sd-cli test-backend-ops" -DSD_VULKAN=ON -DGGML_BUILD_TESTS=ON
      - name: test-backend-ops (Vulkan vs CPU)
        run: |
          . ./lib.sh; TBO_TIMEOUT=1800 tbo h/build/bin/test-backend-ops $OPS_LIGHT
      - name: Smoke master vs head
        run: |
          . ./lib.sh; get_model
          smoke m/build/bin/sd-cli out/m 256
          smoke h/build/bin/sd-cli out/h 256
          compare_dirs out/m out/h
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with: {name: "smoke-linux-vulkan-${{ matrix.ref }}", path: "out\ntbo-*.log", if-no-files-found: ignore}

  macos-metal:
    name: macos-metal ${{ matrix.ref }}
    runs-on: macos-14
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ref: pr17, sha: ca92d95ddf041bf885a36a7fdafbffd88706c28e}
          - {ref: pr18, sha: 5f222b85a9b52e7d6f43fdffcb0772806459154b}
          - {ref: pr19, sha: 338079ece82649c7535da4bbba663f29b4bc1a25}
          - {ref: pr20, sha: aff34f1542edb66acf2f5bb5daae1c895db0afe4}
    steps:
      - name: Build master and head (patched)
        run: |
          curl -fsSL "$LIB_URL" -o lib.sh; . ./lib.sh
          M="-DSD_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0"
          fetch_src "$MASTER_SHA" m 0 && build_sd m sd-cli $M
          fetch_src "${{ matrix.sha }}" h 1 && build_sd h "sd-cli test-backend-ops" $M -DGGML_BUILD_TESTS=ON
      - name: test-backend-ops (Metal vs CPU)
        run: |
          . ./lib.sh; tbo h/build/bin/test-backend-ops $OPS_FULL
      - name: Smoke master vs head
        run: |
          . ./lib.sh; get_model
          smoke m/build/bin/sd-cli out/m 512
          smoke h/build/bin/sd-cli out/h 512
          compare_dirs out/m out/h
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with: {name: "smoke-macos-metal-${{ matrix.ref }}", path: "out\ntbo-*.log", if-no-files-found: ignore}

  macos-intel-cpu:
    name: macos-intel-cpu ${{ matrix.ref }}
    runs-on: macos-15-intel
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ref: pr20, sha: aff34f1542edb66acf2f5bb5daae1c895db0afe4}
    steps:
      - name: Build head (patched)
        run: |
          curl -fsSL "$LIB_URL" -o lib.sh; . ./lib.sh
          fetch_src "${{ matrix.sha }}" h 1 && build_sd h sd-cli -DSD_METAL=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3

  windows:
    name: windows-msvc ${{ matrix.ref }} vulkan=${{ matrix.vulkan }}
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        ref: [pr17, pr18, pr19, pr20]
        vulkan: ["OFF", "ON"]
        include:
          - {ref: pr17, sha: ca92d95ddf041bf885a36a7fdafbffd88706c28e}
          - {ref: pr18, sha: 5f222b85a9b52e7d6f43fdffcb0772806459154b}
          - {ref: pr19, sha: 338079ece82649c7535da4bbba663f29b4bc1a25}
          - {ref: pr20, sha: aff34f1542edb66acf2f5bb5daae1c895db0afe4}
    env:
      VULKAN_VERSION: 1.4.328.1
      VULKAN_SHA256: a8675df6d538079c2a719a9373994948091db785b48f142e024254e76348d16c
    steps:
      - name: Install Ninja
        run: choco install ninja --no-progress
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - name: Install Vulkan SDK
        if: ${{ matrix.vulkan == 'ON' }}
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'VulkanSDK'
          curl.exe --fail --location --retry 3 --output $installer "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $env:VULKAN_SHA256) { throw 'Vulkan SDK SHA256 mismatch' }
          $install = Start-Process -FilePath $installer -ArgumentList @('--root', "`"$sdkRoot`"", '--accept-licenses', '--default-answer', '--confirm-command', 'install') -Wait -PassThru
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdkRoot"
          Add-Content $env:GITHUB_PATH "$sdkRoot\Bin"
      - name: Fetch head (patched)
        shell: bash
        run: |
          curl -fsSL "$LIB_URL" -o lib.sh; . ./lib.sh
          fetch_src "${{ matrix.sha }}" h 1
      - name: Build (MSVC, as the prebuilt Windows leg)
        shell: pwsh
        run: |
          cmake -S h -B h/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS='/bigobj' `
            -DSD_BUILD_EXAMPLES=ON -DSD_SERVER_BUILD_FRONTEND=OFF -DSD_WEBP=OFF -DSD_WEBM=OFF `
            -DSD_VULKAN=${{ matrix.vulkan }} -DGGML_NATIVE=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build h/build --config Release -j 4 --target sd-cli sd-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: CPU smoke (tiling threads under MSVC)
        if: ${{ matrix.vulkan == 'OFF' }}
        shell: bash
        run: |
          . ./lib.sh; get_model
          smoke h/build/bin/sd-cli.exe out/h 384
          for f in out/h/*.png; do echo "$f $(sha16 "$f")"; done

  # Build-only, the prebuilt Linux CUDA recipe: CUDA 12.8.1 and the same eight architectures,
  # so sm70 (Volta) and sm75 (Turing) code generation is exercised for every patch.
  cuda-build:
    name: cuda-build ${{ matrix.ref }} cudnn=${{ matrix.cudnn }}
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ref: master, sha: 6321a6935234c2bb09c77604874a439344faa7f6, cudnn: "OFF", archs: "70;75;80;86;89;90;100;120"}
          - {ref: pr17, sha: ca92d95ddf041bf885a36a7fdafbffd88706c28e, cudnn: "OFF", archs: "70;75;80;86;89;90;100;120"}
          - {ref: pr18, sha: 5f222b85a9b52e7d6f43fdffcb0772806459154b, cudnn: "OFF", archs: "70;75;80;86;89;90;100;120"}
          - {ref: pr19, sha: 338079ece82649c7535da4bbba663f29b4bc1a25, cudnn: "OFF", archs: "70;75;80;86;89;90;100;120"}
          - {ref: pr20, sha: aff34f1542edb66acf2f5bb5daae1c895db0afe4, cudnn: "ON", archs: "70;75;80;86;89;90;100;120"}
          - {ref: pr20, sha: aff34f1542edb66acf2f5bb5daae1c895db0afe4, cudnn: "OFF", archs: "70;75;86"}
    steps:
      - name: Free disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost; df -h /
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@95b5a29a2823ef87666dcd45ec236fc4f82498d0  # v0.2.22
        with:
          cuda: "12.8.1"
          method: "network"
          sub-packages: '["nvcc", "cudart", "cudart-dev", "thrust"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'
      - name: cuDNN headers
        if: ${{ matrix.cudnn == 'ON' }}
        run: |
          set -euo pipefail
          deb=libcudnn9-headers-cuda-12_9.27.0.42-1_amd64.deb
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$deb" "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/x86_64/$deb"
          echo "68243ab04422da565e0bafec00f64ac08cfd82d805c8015c0c503af7ab4dd1d6  $RUNNER_TEMP/$deb" | sha256sum -c -
          dpkg -x "$RUNNER_TEMP/$deb" "$RUNNER_TEMP/cudnn-deb"
          inc="$RUNNER_TEMP/cudnn-include"; mkdir -p "$inc"
          for f in "$RUNNER_TEMP"/cudnn-deb/usr/include/x86_64-linux-gnu/cudnn*_v9.h; do b="$(basename "$f")"; ln -s "$f" "$inc/${b%_v9.h}.h"; done
          echo "CUDNN_FLAGS=-DGGML_CUDA_CUDNN=ON -DGGML_CUDA_CUDNN_INCLUDE_DIR=$inc" >> "$GITHUB_ENV"
      - name: Build sd-cli + sd-server
        run: |
          curl -fsSL "$LIB_URL" -o lib.sh; . ./lib.sh
          P=1; [ "${{ matrix.ref }}" = master ] && P=0
          fetch_src "${{ matrix.sha }}" h $P
          build_sd h "sd-cli sd-server" -DSD_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="${{ matrix.archs }}" ${CUDNN_FLAGS:-}
          for exe in sd-cli sd-server; do readelf -d h/build/bin/$exe | grep NEEDED; done
          if readelf -d h/build/bin/sd-cli | grep -q 'NEEDED.*cudnn'; then echo "links cudnn"; exit 1; fi
          cuobjdump --list-elf h/build/bin/sd-cli 2>/dev/null | grep -oE 'sm_[0-9]+' | sort | uniq -c || true

  hip-build:
    name: hip-build ${{ matrix.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ref: master, sha: 6321a6935234c2bb09c77604874a439344faa7f6}
          - {ref: pr17, sha: ca92d95ddf041bf885a36a7fdafbffd88706c28e}
          - {ref: pr18, sha: 5f222b85a9b52e7d6f43fdffcb0772806459154b}
          - {ref: pr19, sha: 338079ece82649c7535da4bbba663f29b4bc1a25}
          - {ref: pr20, sha: aff34f1542edb66acf2f5bb5daae1c895db0afe4}
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost || true
          sudo apt-get install -y -q ninja-build; df -h /
      - name: ROCm (TheRock wheels, as build.yml)
        run: |
          python3 -m venv .venv; . .venv/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install -q --index-url https://repo.amd.com/rocm/whl-multi-arch/ "rocm[libraries,devel]==7.14.0"
          R=$(rocm-sdk path --root)
          { echo "ROCM_PATH=$R"; echo "HIP_PATH=$R"; echo "CMAKE_PREFIX_PATH=$(rocm-sdk path --cmake)"; echo "LD_LIBRARY_PATH=$R/lib"; } >> "$GITHUB_ENV"
          echo "$(rocm-sdk path --bin)" >> "$GITHUB_PATH"; echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build sd-cli (HIP)
        run: |
          curl -fsSL "$LIB_URL" -o lib.sh; . ./lib.sh
          P=1; [ "${{ matrix.ref }}" = master ] && P=0
          fetch_src "${{ matrix.sha }}" h $P
          build_sd h sd-cli -G Ninja -DSD_HIPBLAS=ON -DHIP_PLATFORM=amd -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DGPU_TARGETS="gfx906;gfx90a;gfx942;gfx1030;gfx1100;gfx1151;gfx1201"

  # Every commit in master..pr20 (merges included), CPU, with and without the carried patches.
  commits-list:
    runs-on: ubuntu-22.04
    outputs:
      shas: ${{ steps.l.outputs.shas }}
    steps:
      - id: l
        run: |
          git init -q r; cd r; git remote add origin "$REPO_URL"
          git fetch -q --filter=blob:none origin perf/h3-cudnn-attn:refs/heads/h
          git rev-list --reverse "$MASTER_SHA"..h | wc -l
          echo "shas=$(git rev-list --reverse "$MASTER_SHA"..h | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  commits:
    name: commit ${{ matrix.sha }} patched=${{ matrix.patched }}
    needs: commits-list
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        sha: ${{ fromJSON(needs.commits-list.outputs.shas) }}
        patched: ["1", "0"]
    steps:
      - run: |
          curl -fsSL "$LIB_URL" -o lib.sh; . ./lib.sh
          fetch_src "${{ matrix.sha }}" h "${{ matrix.patched }}"
          git -C h log -1 --format='%h %s'
          build_sd h sd-cli
