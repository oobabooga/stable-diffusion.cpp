name: Stack 17-20 build matrix (throwaway)

on:
  push:
    branches: [stack-p82-ci]

permissions: {}

env:
  REPO: https://github.com/unslothai/stable-diffusion.cpp
  SHA_master: 6321a6935234c2bb09c77604874a439344faa7f6
  SHA_pr17: ca92d95ddf041bf885a36a7fdafbffd88706c28e
  SHA_pr18: 5f222b85a9b52e7d6f43fdffcb0772806459154b
  SHA_pr19: 338079ece82649c7535da4bbba663f29b4bc1a25
  SHA_pr20: aff34f1542edb66acf2f5bb5daae1c895db0afe4

jobs:
  # The prebuilt workflow's non-CUDA unix legs, built exactly as it builds them (patches applied).
  unix:
    name: unix ${{ matrix.leg }} ${{ matrix.head }} patched=${{ matrix.patched }}
    strategy:
      fail-fast: false
      matrix:
        head: [master, pr17, pr18, pr19, pr20]
        leg: [linux-x64, linux-arm64, linux-vulkan, mac-arm64-metal, mac-x64]
        patched: ["1"]
        include:
          - { leg: linux-x64, runner: ubuntu-22.04, defines: "" }
          - { leg: linux-arm64, runner: ubuntu-24.04-arm, defines: "" }
          - { leg: linux-vulkan, runner: ubuntu-22.04, defines: "-DSD_VULKAN=ON", vulkan: "1" }
          - { leg: mac-arm64-metal, runner: macos-14, defines: "-DSD_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DGGML_BUILD_TESTS=ON", tbo: "1" }
          - { leg: mac-x64, runner: macos-15-intel, defines: "-DSD_METAL=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3" }
          # Source builds without the carried patches (what a plain `git clone --recursive` builds).
          - { head: pr17, leg: linux-x64, patched: "0", runner: ubuntu-22.04, defines: "" }
          - { head: pr18, leg: linux-x64, patched: "0", runner: ubuntu-22.04, defines: "" }
          - { head: pr19, leg: linux-x64, patched: "0", runner: ubuntu-22.04, defines: "" }
          - { head: pr20, leg: linux-x64, patched: "0", runner: ubuntu-22.04, defines: "" }
          - { head: pr20, leg: linux-vulkan, patched: "0", runner: ubuntu-22.04, defines: "-DSD_VULKAN=ON", vulkan: "1" }
          - { head: pr20, leg: mac-arm64-metal, patched: "0", runner: macos-14, defines: "-DSD_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      VULKAN_VERSION: 1.4.328.1
      VULKAN_SHA256: 241e75b56c91c0d210ed07a7c638ec05a3e5b0e4c66ba9f0ba0f102d823ad6bf
    steps:
      - name: Source
        run: |
          set -euo pipefail
          eval "SHA=\$SHA_${{ matrix.head }}"
          git init -q src && cd src
          git remote add origin "$REPO"
          git fetch -q --depth 1 origin "$SHA" && git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 ggml
          n=0
          if [ "${{ matrix.patched }}" = 1 ]; then
            for p in scripts/unsloth/ggml-patches/*.patch; do
              [ -e "$p" ] || continue
              git -C ggml apply "../$p"; n=$((n+1)); echo "applied $p"
            done
          fi
          echo "head=$(git rev-parse --short HEAD) ggml=$(git -C ggml rev-parse --short HEAD) patches=$n"
      - name: Vulkan SDK
        if: ${{ matrix.vulkan == '1' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev xz-utils
          archive="$RUNNER_TEMP/vulkansdk.tar.xz"; sdk_root="$RUNNER_TEMP/vulkansdk"
          curl --fail --location --retry 3 --output "$archive" "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_VERSION}.tar.xz"
          echo "$VULKAN_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$sdk_root"; tar -xJf "$archive" -C "$sdk_root" --strip-components=1
          echo "VULKAN_SDK=$sdk_root/x86_64" >> "$GITHUB_ENV"; echo "$sdk_root/x86_64/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: src
        run: |
          set -euo pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_EXAMPLES=ON -DSD_SERVER_BUILD_FRONTEND=OFF \
            -DSD_WEBP=OFF -DSD_WEBM=OFF -DGGML_NATIVE=OFF ${{ matrix.defines }} > cmake.log 2>&1 || { tail -60 cmake.log; exit 1; }
          grep -iE "fused|ggml lacks" cmake.log || true
          if [ "$(uname -s)" = "Darwin" ]; then J="$(sysctl -n hw.logicalcpu)"; else J="$(nproc)"; fi
          T="sd-cli sd-server"; [ "${{ matrix.tbo }}" = 1 ] && T="$T test-backend-ops"
          cmake --build build --config Release -j "$J" --target $T 2>&1 | tee build.log | grep -E "error|warning: unused|Built target" | head -60
          test "${PIPESTATUS[0]}" = 0
          ./build/bin/sd-cli --help > /dev/null && echo "sd-cli runs"
          grep -c "warning" build.log || true
      - name: test-backend-ops (Metal)
        if: ${{ matrix.tbo == '1' && (matrix.head == 'master' || matrix.head == 'pr20') }}
        working-directory: src
        run: |
          set +e
          ./build/bin/test-backend-ops -b MTL0 > tbo.log 2>&1; echo "exit=$?"
          grep -E "Backend|Testing|tests passed|backends passed" tbo.log | head -20
          echo "FAIL lines:"; grep -E "FAIL" tbo.log | head -80
          grep -E "^\s+[A-Z_0-9]+\(" tbo.log | sed -E 's/: (OK|FAIL|not supported.*)$/ \1/' | awk '{print $NF}' | sort | uniq -c
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ always() && matrix.tbo == '1' }}
        with:
          name: tbo-${{ matrix.leg }}-${{ matrix.head }}-p${{ matrix.patched }}
          path: src/tbo.log
          if-no-files-found: ignore

  windows:
    name: windows ${{ matrix.vulkan == 'ON' && 'vulkan' || 'cpu' }} ${{ matrix.head }}
    strategy:
      fail-fast: false
      matrix:
        head: [master, pr17, pr18, pr19, pr20]
        vulkan: ["OFF", "ON"]
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      VULKAN_VERSION: 1.4.328.1
      VULKAN_SHA256: a8675df6d538079c2a719a9373994948091db785b48f142e024254e76348d16c
    steps:
      - name: Source
        shell: bash
        run: |
          set -euo pipefail
          eval "SHA=\$SHA_${{ matrix.head }}"
          git init -q src && cd src
          git remote add origin "$REPO"
          git fetch -q --depth 1 origin "$SHA" && git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 ggml
          for p in scripts/unsloth/ggml-patches/*.patch; do
            [ -e "$p" ] || continue
            git -C ggml apply "../$p"; echo "applied $p"
          done
      - name: Install Ninja
        run: choco install ninja --no-progress
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - name: Install Vulkan SDK
        if: ${{ matrix.vulkan == 'ON' }}
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'VulkanSDK'
          curl.exe --fail --location --retry 3 --output $installer "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $env:VULKAN_SHA256) { throw 'Vulkan SDK installer SHA256 mismatch' }
          $install = Start-Process -FilePath $installer -ArgumentList @('--root', "`"$sdkRoot`"", '--accept-licenses', '--default-answer', '--confirm-command', 'install') -Wait -PassThru
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdkRoot"
          Add-Content $env:GITHUB_PATH "$sdkRoot\Bin"
      - name: Build
        shell: pwsh
        working-directory: src
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS='/bigobj' `
            -DSD_BUILD_EXAMPLES=ON -DSD_SERVER_BUILD_FRONTEND=OFF -DSD_WEBP=OFF -DSD_WEBM=OFF `
            -DSD_VULKAN=${{ matrix.vulkan }} -DGGML_NATIVE=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release -j 3 --target sd-cli sd-server 2>&1 | Tee-Object -FilePath build.log | Select-String -Pattern 'error|Built target|FAILED' | Select-Object -First 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build\bin\sd-cli.exe)) { throw 'sd-cli.exe missing' }
          .\build\bin\sd-cli.exe --help | Out-Null
          "sd-cli runs, exit $LASTEXITCODE"

  # The prebuilt's Linux CUDA leg (same toolkit action and sub-packages). Narrow arch list per head
  # (Volta, Turing, Ampere, Ada) plus one full as-in-PR run of the #20 leg.
  cuda:
    name: cuda ${{ matrix.head }} ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { head: master, variant: plain, archs: "70;75;80;86;89", cudnn: "0", extra: "[]", tbo: "0" }
          - { head: pr17, variant: plain, archs: "70;75;80;86;89", cudnn: "0", extra: "[]", tbo: "0" }
          - { head: pr18, variant: plain, archs: "70;75;80;86;89", cudnn: "0", extra: "[]", tbo: "0" }
          - { head: pr19, variant: plain, archs: "70;75;80;86;89", cudnn: "0", extra: "[]", tbo: "0" }
          - { head: pr20, variant: cudnn-off, archs: "70;75;80;86;89", cudnn: "0", extra: "[]", tbo: "1" }
          - { head: pr20, variant: cudnn-nvrtc, archs: "70;75;80;86;89", cudnn: "1", extra: '["nvrtc-dev"]', tbo: "1" }
          - { head: pr20, variant: as-in-pr, archs: "70;75;80;86;89;90;100;120", cudnn: "1", extra: "[]", tbo: "0" }
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      CUDA_VERSION: "12.8.1"
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /
      - name: Source
        run: |
          set -euo pipefail
          eval "SHA=\$SHA_${{ matrix.head }}"
          git init -q src && cd src
          git remote add origin "$REPO"
          git fetch -q --depth 1 origin "$SHA" && git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 ggml
          for p in scripts/unsloth/ggml-patches/*.patch; do
            [ -e "$p" ] || continue
            git -C ggml apply "../$p"; echo "applied $p"
          done
      - name: Sub-package list
        id: subpk
        run: |
          python3 -c "import json; print('list=' + json.dumps(['nvcc','cudart','cudart-dev','thrust'] + json.loads('${{ matrix.extra }}')))" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Install CUDA toolkit
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@95b5a29a2823ef87666dcd45ec236fc4f82498d0  # v0.2.22
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: "network"
          sub-packages: ${{ steps.subpk.outputs.list }}
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'
      - name: cuDNN headers (as in #20)
        if: ${{ matrix.cudnn == '1' }}
        run: |
          set -euo pipefail
          deb=libcudnn9-headers-cuda-12_9.27.0.42-1_amd64.deb
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$deb" "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/x86_64/$deb"
          echo "68243ab04422da565e0bafec00f64ac08cfd82d805c8015c0c503af7ab4dd1d6  $RUNNER_TEMP/$deb" | sha256sum -c -
          dpkg -x "$RUNNER_TEMP/$deb" "$RUNNER_TEMP/cudnn-deb"
          inc="$RUNNER_TEMP/cudnn-include"; mkdir -p "$inc"
          for f in "$RUNNER_TEMP"/cudnn-deb/usr/include/x86_64-linux-gnu/cudnn*_v9.h; do b="$(basename "$f")"; ln -s "$f" "$inc/${b%_v9.h}.h"; done
          test -e "$inc/cudnn.h"
          echo "CUDNN_INCLUDE_DIR=$inc" >> "$GITHUB_ENV"
      - name: Build
        working-directory: src
        run: |
          set -euo pipefail
          X=""
          if [ "${{ matrix.cudnn }}" = 1 ]; then X="-DGGML_CUDA_CUDNN=ON -DGGML_CUDA_CUDNN_INCLUDE_DIR=$CUDNN_INCLUDE_DIR"; fi
          T="sd-cli sd-server"; [ "${{ matrix.tbo }}" = 1 ] && X="$X -DGGML_BUILD_TESTS=ON" && T="$T test-backend-ops"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_EXAMPLES=ON -DSD_SERVER_BUILD_FRONTEND=OFF \
            -DSD_WEBP=OFF -DSD_WEBM=OFF -DGGML_NATIVE=OFF -DSD_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="${{ matrix.archs }}" $X > cmake.log 2>&1 || { tail -60 cmake.log; exit 1; }
          grep -iE "fused|cudnn|ggml lacks" cmake.log || true
          cmake --build build --config Release -j "$(nproc)" --target $T > build.log 2>&1 || { grep -E "error|Error" build.log | head -40; tail -20 build.log; exit 1; }
          grep -E "Built target" build.log
      - name: Bundle runtime and check NEEDED
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/src/build/bin"; CUDA_ROOT="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          sudo apt-get install -y -qq patchelf
          for so in libcudart.so.12 libcublas.so.12 libcublasLt.so.12; do
            src="$(find "$CUDA_ROOT" /usr/lib/x86_64-linux-gnu -name "${so}*" -type f 2>/dev/null | sort | tail -1)"
            cp -L "$src" "$BIN/$so"
          done
          for exe in sd-cli sd-server test-backend-ops; do [ -e "$BIN/$exe" ] && patchelf --set-rpath '$ORIGIN' "$BIN/$exe"; done
          for exe in sd-cli sd-server; do readelf -d "$BIN/$exe" | grep NEEDED; done
          if readelf -d "$BIN/sd-cli" | grep -qiE 'NEEDED.*(cudnn|nvrtc)'; then echo "ERROR: link-time cudnn/nvrtc dependency"; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$BIN/sd-cli" "$GITHUB_WORKSPACE/out/"; [ -e "$BIN/test-backend-ops" ] && cp "$BIN/test-backend-ops" "$GITHUB_WORKSPACE/out/"
          if [ "${{ matrix.head }}" = master ]; then cp "$BIN"/lib*.so.12 "$GITHUB_WORKSPACE/out/"; fi
          if [ -d "$GITHUB_WORKSPACE/src/build/_deps/ggml_cudnn_frontend-src" ]; then ls "$GITHUB_WORKSPACE/src/build/_deps/ggml_cudnn_frontend-src"; fi
          ls -la "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ matrix.variant != 'as-in-pr' }}
        with:
          name: cuda-${{ matrix.head }}-${{ matrix.variant }}
          path: out/
          retention-days: 3

  # HIP compiles the ggml-cuda sources, so the CUDA patches reach ROCm builds too. Wave64 (gfx90a, gfx942)
  # and wave32 (gfx1100, gfx1151) targets.
  hip:
    name: hip ${{ matrix.head }} patched=${{ matrix.patched }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { head: master, patched: "0" }
          - { head: pr17, patched: "1" }
          - { head: pr18, patched: "1" }
          - { head: pr19, patched: "1" }
          - { head: pr20, patched: "1" }
          - { head: pr20, patched: "0" }
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ROCM_VERSION: "7.2.1"
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost || true
          docker system prune -af > /dev/null || true
          df -h /
      - name: ROCm
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq build-essential cmake ninja-build wget
          sudo mkdir --parents --mode=0755 /etc/apt/keyrings
          wget -q https://repo.radeon.com/rocm/rocm.gpg.key -O - | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/${ROCM_VERSION} noble main" | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev rocm-hip-sdk > /dev/null
      - name: Source
        run: |
          set -euo pipefail
          eval "SHA=\$SHA_${{ matrix.head }}"
          git init -q src && cd src
          git remote add origin "$REPO"
          git fetch -q --depth 1 origin "$SHA" && git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 ggml
          if [ "${{ matrix.patched }}" = 1 ]; then
            for p in scripts/unsloth/ggml-patches/*.patch; do [ -e "$p" ] || continue; git -C ggml apply "../$p"; echo "applied $p"; done
          fi
      - name: Build
        working-directory: src
        run: |
          set -euo pipefail
          export PATH="/opt/rocm/bin:$PATH"
          cmake -B build -G Ninja -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" -DCMAKE_BUILD_TYPE=Release \
            -DSD_HIPBLAS=ON -DHIP_PLATFORM=amd -DGPU_TARGETS="gfx90a;gfx942;gfx1100;gfx1151" \
            -DSD_BUILD_EXAMPLES=ON -DSD_SERVER_BUILD_FRONTEND=OFF -DSD_WEBP=OFF -DSD_WEBM=OFF -DGGML_NATIVE=OFF \
            -DGGML_BUILD_TESTS=ON > cmake.log 2>&1 || { tail -60 cmake.log; exit 1; }
          grep -iE "fused|ggml lacks" cmake.log || true
          cmake --build build -j "$(nproc)" --target sd-cli test-backend-ops > build.log 2>&1 || { grep -E "error" build.log | head -60; tail -20 build.log; exit 1; }
          grep -E "Built target" build.log
