name: SD18 review AMD

on:
  push:
    branches: [sd18-rev-amd]

permissions: {}

env:
  BASE_SHA: ca92d95ddf041bf885a36a7fdafbffd88706c28e
  PR_SHA: 5f222b85a9b52e7d6f43fdffcb0772806459154b
  GGML_SHA: f583f393cd5dfdc129360bbf75cb3d49ccc837a8
  ROCM_VERSION: 7.14.0

jobs:
  hip:
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 300
    steps:
      - name: Hardware
        run: |
          uname -a; nproc; free -h; df -h "$RUNNER_TEMP"
          ls -l /dev/kfd /dev/dri 2>&1 || true
      - name: Setup ROCm and tools
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/w"; mkdir -p "$W"/{tmp,hf,cache}
          python3 -m venv "$W/venv"; . "$W/venv/bin/activate"
          python -m pip install -q --upgrade pip
          python -m pip install -q cmake ninja huggingface_hub hf_transfer numpy pillow
          python -m pip install -q --no-cache-dir --index-url https://repo.amd.com/rocm/whl-multi-arch/ "rocm[libraries,devel,device-gfx1151]==${ROCM_VERSION}"
          R="$(rocm-sdk path --root)"
          { echo "W=$W"; echo "ROCM_PATH=$R"; echo "HIP_PATH=$R"; echo "CMAKE_PREFIX_PATH=$(rocm-sdk path --cmake)"; echo "LD_LIBRARY_PATH=$R/lib"; echo "TMPDIR=$W/tmp"; echo "HF_HOME=$W/hf"; echo "HF_HUB_ENABLE_HF_TRANSFER=1"; } >> "$GITHUB_ENV"
          { echo "$(rocm-sdk path --bin)"; echo "$W/venv/bin"; } >> "$GITHUB_PATH"
      - name: Start model download
        run: |
          cd "$W"
          nohup python -c "
          from huggingface_hub import hf_hub_download as d
          r='unsloth/MiniMax-H3-GGUF'
          for f in ['vae/minimax_h3_video_vae_fp16.safetensors','vae/minimax_h3_audio_vae_fp32.safetensors','minimax_h3_fl2va_pruned-UD-Q3_K_XL.gguf','qwen3vl_32b_minimax_h3-Q2_K_M.gguf']:
              print(d(r, f, local_dir='$W/models'), flush=True)
          print('DONE', flush=True)
          " > "$W/dl.log" 2>&1 &
      - name: Checkout and patch
        run: |
          set -euo pipefail
          cd "$W"
          git clone -q https://github.com/unslothai/stable-diffusion.cpp src
          git -C src fetch -q origin "$PR_SHA" "$BASE_SHA" || git -C src fetch -q origin perf/h3-gguf-speed perf/h3-gguf-speed-v2
          git clone -q https://github.com/leejet/ggml ggml-clone
          git -C ggml-clone checkout -q "$GGML_SHA"
          for n in base pr; do
            sha=$([ $n = base ] && echo $BASE_SHA || echo $PR_SHA)
            git -C src worktree add -q --detach "$W/$n" "$sha"
            rm -rf "$W/$n/ggml"; cp -r ggml-clone "$W/$n/ggml"
            for p in "$W/$n"/scripts/unsloth/ggml-patches/*.patch; do git -C "$W/$n/ggml" apply "$p"; done
            echo "$n $(git -C $W/$n log --oneline -1) ggml-modified=$(git -C $W/$n/ggml status --short | wc -l)"
          done
      - name: Build (HIP gfx1151)
        run: |
          set -euo pipefail
          for n in base pr; do
            cd "$W/$n"
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
              -DSD_BUILD_EXAMPLES=ON -DSD_SERVER_BUILD_FRONTEND=OFF -DSD_WEBP=OFF -DSD_WEBM=OFF -DGGML_NATIVE=OFF \
              -DSD_HIPBLAS=ON -DHIP_PLATFORM=amd -DGPU_TARGETS=gfx1151 -DGGML_BUILD_TESTS=ON > "$W/cmake-$n.log" 2>&1 || { tail -50 "$W/cmake-$n.log"; exit 1; }
            grep -i "fused" "$W/cmake-$n.log" || true
            /usr/bin/time -v cmake --build build -j 32 --target sd-cli test-backend-ops > "$W/build-$n.log" 2>&1 || { grep -i -E "error" "$W/build-$n.log" | head -40; tail -30 "$W/build-$n.log"; exit 1; }
            grep -E "Elapsed|Maximum resident" "$W/build-$n.log"
          done
      - name: test-backend-ops (ROCm0)
        run: |
          set +e
          for n in base pr; do
            for op in ROPE_PE_PERMUTE MODULATE_ROWS SWIGLU_SCALED RMS_NORM GLU ADD MUL_MAT FLASH_ATTN_EXT; do
              out=$("$W/$n/build/bin/test-backend-ops" test -b ROCm0 -o $op 2>&1)
              echo "$n $op: $(echo "$out" | grep -E "tests passed|not supported|FAIL" | sort | uniq -c | head -5 | tr '\n' ' ')"
              echo "$out" | grep -E "\[FAIL\]|FAIL$" | head -5
            done
          done
          exit 0
      - name: Render base vs PR
        run: |
          set -uo pipefail
          for i in $(seq 1 120); do grep -q DONE "$W/dl.log" && break; sleep 30; done
          cat "$W/dl.log"; grep -q DONE "$W/dl.log" || exit 1
          M="$W/models"
          render() { # name bin envs...
            local name=$1 bin=$2; shift 2
            mkdir -p "$W/out/$name"
            env "$@" /usr/bin/time -f "%e s wall, %M KB" "$bin" -M vid_gen --diffusion-model "$M/minimax_h3_fl2va_pruned-UD-Q3_K_XL.gguf" \
              --vae "$M/vae/minimax_h3_video_vae_fp16.safetensors" --audio-vae "$M/vae/minimax_h3_audio_vae_fp32.safetensors" \
              --llm "$M/qwen3vl_32b_minimax_h3-Q2_K_M.gguf" -p "A red fox runs through fresh snow in a pine forest, soft morning light, wind and crunching snow sounds." \
              --cfg-scale 1.0 -W 480 -H 272 --video-frames 22 --steps 2 --seed 42 --rng cpu --diffusion-fa --fps 24 \
              -o "$W/out/$name/f_%03d.png" > "$W/out/$name.log" 2>&1
            echo "$name exit=$? $(tail -1 $W/out/$name.log)"
            grep -i -E "sampling completed|decode.*completed|generate_video completed|error|assert" "$W/out/$name.log" | tail -8
            ( cd "$W/out/$name" && sha256sum $(ls) | sha256sum | cut -c1-16; ls | wc -l )
          }
          render base "$W/base/build/bin/sd-cli"
          render pr "$W/pr/build/bin/sd-cli"
          render base2 "$W/base/build/bin/sd-cli"
          render pr2 "$W/pr/build/bin/sd-cli"
          if ! diff -rq "$W/out/base" "$W/out/pr"; then
            render pr_alloff "$W/pr/build/bin/sd-cli" SD_H3_GRAPH_FAST=0 SD_H3_VAE_GRAPH_OPT=0 SD_H3_VAE_KEEP_RESIDENT=0 GGML_CUDA_CUBLAS_EPILOGUE_FUSION=0 GGML_CUDA_NORM_SMALL_ROWS=0 GGML_CUDA_FA_LONGSEQ=0
            for lv in SD_H3_GRAPH_FAST SD_H3_VAE_GRAPH_OPT GGML_CUDA_CUBLAS_EPILOGUE_FUSION GGML_CUDA_NORM_SMALL_ROWS; do
              render pr_no_$lv "$W/pr/build/bin/sd-cli" $lv=0
            done
            python - "$W/out" <<'PY'
          import sys, os, numpy as np
          from PIL import Image
          root = sys.argv[1]
          ref = os.path.join(root, 'base')
          for arm in sorted(os.listdir(root)):
              d = os.path.join(root, arm)
              if not os.path.isdir(d) or arm == 'base': continue
              mse = []; same = 0; n = 0
              for f in sorted(os.listdir(ref)):
                  if not f.endswith('.png') or not os.path.exists(os.path.join(d, f)): continue
                  a = np.asarray(Image.open(os.path.join(ref, f)), dtype=np.float64); b = np.asarray(Image.open(os.path.join(d, f)), dtype=np.float64)
                  n += 1; same += int((a == b).all()); mse.append(((a - b) ** 2).mean())
              m = float(np.mean(mse)) if mse else float('nan')
              psnr = float('inf') if m == 0 else 10 * np.log10(255 ** 2 / m)
              print(f"{arm}: frames identical {same}/{n}, PSNR vs base {psnr:.2f} dB")
          PY
          fi
          for a in base pr base2 pr2; do ls "$W/out/$a" | grep -v png; done
          sha256sum "$W"/out/*/*.wav 2>/dev/null || true

  windows-msvc:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 90
    steps:
      - name: Build PR head with all ggml patches (MSVC, CPU) and run CPU checks
        shell: cmd
        run: |
          cd /d %RUNNER_TEMP%
          git clone -q https://github.com/unslothai/stable-diffusion.cpp sd || exit /b 1
          cd sd
          git fetch -q origin %PR_SHA% || exit /b 1
          git checkout -q %PR_SHA% || exit /b 1
          git submodule update --init ggml || exit /b 1
          git -C ggml checkout -q %GGML_SHA% || exit /b 1
          for %%P in (scripts\unsloth\ggml-patches\*.patch) do (
            git -C ggml apply ..\scripts\unsloth\ggml-patches\%%~nxP || (echo PATCH FAILED %%P & exit /b 1)
          )
          git -C ggml status --short
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSD_WEBM=OFF -DSD_WEBP=OFF -DSD_SERVER_BUILD_FRONTEND=OFF -DGGML_BUILD_TESTS=ON > cmake.log 2>&1 || (type cmake.log & exit /b 1)
          findstr /I "fused" cmake.log
          cmake --build build --config Release --target sd-cli sd-server test-backend-ops -j 16 > build.log 2>&1 || (findstr /I /C:"error" build.log & exit /b 1)
          findstr /I /C:"ops.cpp" /C:"tiling.cpp" /C:"minimax_h3" build.log | findstr /I "warning error"
          dir /s /b build\bin\Release\*.exe
          build\bin\Release\sd-cli.exe --version
          exit /b 0
